<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Survey Crops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#06101B; --deep:#0B2630; --moss:#12382C;
  --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.13);
  --ink:#F4F1E6; --mute:rgba(244,241,230,.62);
  --gold:#F2C14E; --leaf:#7BD389; --water:#4FC3F7; --coral:#FF7A6B; --amber:#FFB547; --teal:#2BB3A3;
  --display:"Space Grotesk","Noto Sans Bengali",system-ui,sans-serif;
  --body:"Inter","Noto Sans Bengali",system-ui,sans-serif;
  --bn:"Noto Sans Bengali","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:15px/1.45 var(--body);display:flex;justify-content:center;padding-inline:0;overflow:hidden}
body.lang-bn{font-family:var(--bn)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 0% 0%,rgba(43,179,163,.22),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(242,193,78,.14),transparent 60%),linear-gradient(180deg,var(--night),var(--deep) 55%,var(--moss));overflow:hidden}
/* top bar */
.top{flex:0 0 auto;z-index:20;display:flex;align-items:center;gap:6px;padding:12px 12px 8px;background:linear-gradient(180deg,rgba(6,16,27,.92),rgba(6,16,27,.6) 80%,transparent)}
.logo{display:flex;align-items:center;gap:6px;font:700 17px var(--display);margin-right:auto;cursor:pointer;white-space:nowrap}
@media (max-width:380px){.logo{font-size:14px;gap:4px}}
.logo i{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--leaf));display:block}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.seg button{padding:5px 10px;border-radius:99px;font-weight:700;font-size:12px;opacity:.7;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#10202A;opacity:1}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn[aria-pressed="true"]{background:rgba(123,211,137,.2);border-color:var(--leaf);color:var(--leaf)}
.iconbtn.speak{background:var(--gold);color:#10202A;border-color:transparent}
.iconbtn.speak.on{animation:breathe 1s ease-in-out infinite}
.aa{font:700 14px var(--display)}
/* screens */
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;overscroll-behavior:contain}
.screen{display:none;animation:rise .45s ease-out both}
.screen.on{display:block}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font:700 28px/1.15 var(--display);margin:6px 0 4px;text-wrap:balance}
.lang-bn h1{font-family:var(--bn);font-size:26px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px;max-width:60ch}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.02em}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:16px}
.btn.gold{background:linear-gradient(90deg,var(--gold),#E8A93A);color:#10202A;box-shadow:0 8px 24px rgba(242,193,78,.3)}
.btn.teal{background:linear-gradient(90deg,var(--teal),var(--water));color:#06201D}
.btn.ghost{border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.mock{font-size:10px;font-weight:600;color:#FFD28A;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);border-radius:10px;padding:5px 10px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;width:min(400px,calc(100% - 32px));background:#0C1F29;border:1px solid var(--water);border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* start */
.orbit{position:relative;height:230px;display:grid;place-items:center;margin:4px 0 6px}
.ring{position:absolute;border-radius:50%;border:1.5px dashed rgba(255,255,255,.2)}
.r1{width:230px;height:230px}.r2{width:170px;height:170px;border:1px solid rgba(43,179,163,.3)}
.earth{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#35C9B4,#12605A 55%,#08282C);box-shadow:0 0 60px rgba(43,179,163,.55);position:relative;overflow:hidden}
.earth b{position:absolute;border-radius:50%;background:rgba(123,211,137,.5)}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #10202A;left:calc(50% + 4px);top:calc(50% - 6px);box-shadow:0 0 12px var(--gold)}
.pin::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold);animation:pulse 1.6s ease-out infinite}
.sat{position:absolute;width:230px;height:230px;animation:spin 14s linear infinite}
.sat span{position:absolute;left:50%;top:-8px;transform:translateX(-50%);display:flex;gap:3px;align-items:center}
.sat span i{width:18px;height:8px;background:var(--water);border-radius:2px;display:block}.sat span b{width:14px;height:14px;background:#F4F1E6;border-radius:4px;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes breathe{50%{transform:scale(1.08)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(242,193,78,.12)}
/* map */
.map{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1.05;max-width:100%;background:#16301F;touch-action:manipulation}
.map svg{display:block;width:100%;height:100%;cursor:crosshair}
.gpschip{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(6,16,27,.8);border:1px solid rgba(79,195,247,.5);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.gpschip i{width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.gpulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.outline{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .3s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.note{display:flex;gap:10px;background:rgba(79,195,247,.1);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--mute)}
.note::before{content:"";flex:0 0 4px;border-radius:2px;background:var(--water)}
/* crops */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);text-align:center;position:relative;min-height:170px}
.tile[aria-pressed="true"]{border:2px solid var(--gold);background:rgba(242,193,78,.12)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;right:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#10202A;font-weight:700;display:grid;place-items:center;font-size:14px}
.pic{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,#2F6B4A,#173828);display:grid;place-items:center}
.tname{font-weight:700;font-size:16px}
.tbn{font-family:var(--bn);font-size:12px;color:var(--mute)}
.bad{font-size:10px;font-weight:700;border-radius:99px;padding:3px 8px;background:rgba(123,211,137,.16);color:#9BE3A6}
.bad.hi{background:rgba(255,122,107,.16);color:#FF9A8C}
/* twin */
.scene{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.wchip{position:absolute;left:12px;top:12px;background:rgba(6,16,27,.78);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;color:#9BE3A6;max-width:calc(100% - 24px)}
.wchip.warn{color:var(--amber)}
.date{position:absolute;right:12px;bottom:10px;background:rgba(6,16,27,.7);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.head{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:50% 100%}
.stem{transition:stroke .8s}.lf{transition:fill .8s}
.rain line{stroke:#8FD8FA;stroke-width:2;stroke-linecap:round;animation:fall .7s linear infinite}
@keyframes fall{from{transform:translateY(-14px)}to{transform:translateY(46px)}}
.rain,.waterl,.glow,.fog{transition:opacity .7s}
.glow{transform-box:fill-box;transform-origin:center;animation:heat 1.4s ease-in-out infinite}
@keyframes heat{50%{transform:scale(1.25)}}
.controls{display:flex;align-items:center;gap:12px;margin-top:12px}
.play{flex:0 0 52px;height:52px;border-radius:50%;background:var(--gold);color:#10202A;display:grid;place-items:center}
input[type=range]{flex:1;accent-color:var(--gold);height:30px}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin:2px 4px 0 68px}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.say .big{flex:0 0 52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.say p{margin:0;font-size:16px;font-weight:600;line-height:1.4}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.need{border-radius:14px;padding:10px;border:1px solid;font-size:11px}
.need b{display:block;font:700 15px var(--display);color:var(--ink);margin-top:2px}
.lang-bn .need b{font-family:var(--bn)}
.stages{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.stage{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);opacity:.55;transition:opacity .4s,background .4s}
.stage.now{opacity:1;background:rgba(242,193,78,.12);outline:1px solid rgba(242,193,78,.5)}
.stage.done{opacity:.85}
.wk{flex:0 0 56px;text-align:center;border-radius:8px;padding:3px 0;font:700 13px var(--display)}
.wk small{display:block;font:700 8px var(--body);letter-spacing:.08em;opacity:.8}
/* help */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mode{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid;font-weight:600;font-size:12px;min-height:36px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:22px;border:1px solid var(--line);background:var(--panel);text-align:center;position:relative;min-height:190px;transition:transform .3s,border-color .3s,background .3s}
.pstep.speaking{transform:scale(1.04);border-color:var(--gold);background:rgba(242,193,78,.14)}
.pstep .n{position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--display);color:#10202A}
.pstep .spk{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.pstep .pic{width:84px;height:84px;background:rgba(6,16,27,.45)}
.pstep strong{font-size:15px;line-height:1.25}
.wave{display:flex;align-items:center;gap:3px;height:34px}
.wave i{width:4px;border-radius:2px;background:var(--gold);height:30%;display:block}
.wave.on i{animation:wv .8s ease-in-out infinite}
@keyframes wv{50%{height:100%}}
.pics-mode .detail{display:none}
.pics-mode .pic{transform:scale(1.15)}
/* bottom nav */
nav{flex:0 0 auto;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(6,16,27,.94);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:600;color:var(--mute);min-height:56px}
nav button[aria-current="page"]{color:var(--gold);background:rgba(242,193,78,.1)}
/* now-crop + year strip */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .tile{min-height:132px;padding:10px 6px}.grid3 .pic{width:56px;height:56px}.grid3 .tname{font-size:13px}
h2.q{font:700 17px var(--display);margin:18px 0 8px}.lang-bn h2.q{font-family:var(--bn)}
.harv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:left;font-weight:600;font-size:13px;min-height:58px}
.hbtn[aria-pressed="true"]{border:2px solid var(--gold);background:rgba(242,193,78,.12)}
.hdots{display:flex;gap:3px;flex:0 0 auto}.hdots i{width:7px;height:18px;border-radius:3px;background:rgba(255,255,255,.18);display:block}.hdots i.f{background:var(--gold)}
.early{display:flex;gap:12px;align-items:center;margin-top:12px;border-color:rgba(123,211,137,.5);background:rgba(123,211,137,.1)}
.early .dd{flex:0 0 auto;text-align:center;background:rgba(0,0,0,.25);border-radius:14px;padding:6px 12px}
.early .dd b{display:block;font:700 28px/1 var(--display);color:#9BE3A6}.early .dd span{font-size:10px;font-weight:700;letter-spacing:.06em}
.year{margin:4px 0 14px}.ybar{position:relative;height:44px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden}
.yblk{position:absolute;top:6px;bottom:6px;border-radius:8px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;color:#10202A;white-space:nowrap;overflow:hidden}
.yblk.ghost{background:repeating-linear-gradient(45deg,rgba(79,195,247,.25) 0 6px,rgba(79,195,247,.12) 6px 12px);color:#BFE9FB;border:1px dashed rgba(79,195,247,.7)}
.ymon{display:grid;grid-template-columns:repeat(12,1fr);font-size:9px;color:var(--mute);margin-top:3px;text-align:center}
.ynote{font-size:12px;margin-top:6px;color:var(--mute)}.ynote b{color:var(--ink)}
.fit{font-size:10px;font-weight:700;border-radius:99px;padding:3px 8px}
.fit.ontime{background:rgba(123,211,137,.16);color:#9BE3A6}.fit.late{background:rgba(255,181,71,.16);color:#FFD28A}.fit.toolate{background:rgba(255,122,107,.16);color:#FF9A8C}
.tile.dim{opacity:.55}
.late{display:flex;gap:12px;align-items:flex-start;margin-top:12px;border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}
[hidden]{display:none!important}
/* leaflet core (inlined subset of leaflet.css 1.9.4, BSD-2) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#16301F;outline-offset:1px;font:12px var(--body);-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0;mix-blend-mode:plus-lighter}
.leaflet-container .leaflet-tile{max-width:none!important}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control-container .leaflet-top,.leaflet-control-container .leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both;position:relative;z-index:800;pointer-events:auto}
.leaflet-right .leaflet-control{float:right;margin-right:8px}.leaflet-bottom .leaflet-control{margin-bottom:6px}.leaflet-top .leaflet-control{margin-top:56px}.leaflet-left .leaflet-control{margin-left:8px}
.leaflet-control-zoom a{display:block;width:34px;height:34px;line-height:32px;text-align:center;text-decoration:none;font:700 20px var(--body);background:rgba(6,16,27,.85);color:#fff;border:1px solid var(--line)}
.leaflet-control-zoom a:first-child{border-radius:10px 10px 0 0}.leaflet-control-zoom a:last-child{border-radius:0 0 10px 10px}
.leaflet-control-attribution{background:rgba(6,16,27,.7);color:#ccc;font-size:9px;padding:1px 6px;border-radius:6px}.leaflet-control-attribution a{color:#8FD8FA}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-div-icon{background:none;border:0}
.leaf{position:absolute;inset:0;z-index:1}
#mapsvg{position:absolute;inset:0;z-index:0}
.map.live #mapsvg{display:none}
.gpschip{z-index:1100}
.layers{position:absolute;left:12px;bottom:12px;z-index:1100;display:flex;gap:6px;flex-wrap:wrap}
.layers button{background:rgba(6,16,27,.85);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700;min-height:30px}
.layers button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.maplinks{display:flex;gap:8px;flex-wrap:wrap}
.maplinks a,.src a,.srcbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid rgba(79,195,247,.55);color:#8FD8FA;font-size:12px;font-weight:600;text-decoration:none;background:rgba(79,195,247,.08)}
.srcbtn{padding:3px 9px;font-size:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 6px}
.pill.real{background:rgba(123,211,137,.2);color:#9BE3A6}.pill.sample{background:rgba(255,181,71,.2);color:#FFD28A}
/* farm inputs */
.water{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:600;text-align:center;min-height:92px}
.wopt[aria-pressed="true"]{border:2px solid var(--water);background:rgba(79,195,247,.12)}
.drops{display:flex;gap:2px;height:22px;align-items:flex-end}
.prio{display:flex;flex-wrap:wrap;gap:8px}
.soil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soil div{border-radius:12px;padding:8px;background:rgba(201,163,106,.12);border:1px solid rgba(201,163,106,.4);font-size:10px;color:var(--mute)}
.soil b{display:block;color:var(--ink);font:700 14px var(--display)}
.lang-bn .soil b{font-family:var(--bn)}
/* plans */
.plan{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%}
.plan.best{border:2px solid var(--gold);background:linear-gradient(160deg,rgba(242,193,78,.14),rgba(255,255,255,.04))}
.plan .row{display:flex;align-items:center;gap:12px}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chain span.c{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700;color:#10202A}
.chain i{color:var(--mute);font-style:normal}
.sring{flex:0 0 64px}
.sring text{font:700 16px var(--display);fill:var(--ink)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:11px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.badge-best{position:absolute;right:12px;top:-10px;background:var(--gold);color:#10202A;font-size:10px;font-weight:800;border-radius:99px;padding:3px 10px}
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,8,14,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:rise .3s ease-out}
.sheet{width:100%;max-width:420px;max-height:88%;overflow:auto;background:#0C1F29;border:1px solid rgba(242,193,78,.5);border-radius:24px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h3{font:700 20px var(--display);margin:4px 0 6px}.lang-bn .sheet h3{font-family:var(--bn)}
.why{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:0;list-style:none;font-size:13px}
.why li{display:flex;gap:8px}.why li::before{content:"✓";color:var(--leaf);font-weight:800}
/* flood */
.fkpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fkpi .k{border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--panel)}
.fkpi .k b{display:block;font:700 26px/1.1 var(--display);margin:4px 0}
.fkpi .k small{color:var(--mute);font-size:11px}
.fchart svg{display:block;width:100%;height:auto}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2s .2s ease-in-out forwards}
.pop{animation:popin .5s 2s both}@keyframes popin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.rfcard{margin:10px 0 12px;padding:12px;border-color:rgba(242,193,78,.55);background:rgba(242,193,78,.07)}
.rfcard .id{font:700 11px var(--display);letter-spacing:.08em;color:var(--gold)}
.rfcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0 0;font-size:12px}.rfcard dt{color:var(--mute)}.rfcard dd{margin:0}
.rfbtn{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px}
.rfbtn[aria-pressed=true]{border-color:var(--gold);background:rgba(242,193,78,.12)}
.vid{position:relative;border-radius:14px;overflow:hidden;background:#000;margin-top:10px;aspect-ratio:16/9}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vidempty{border:2px dashed rgba(242,193,78,.5);border-radius:14px;padding:14px;margin-top:10px;font-size:12px;color:var(--mute)}
.vidempty label{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;cursor:pointer}
.topview{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:#16301F}
.zv{position:relative;touch-action:none;user-select:none}
.zv canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}.zv canvas:active{cursor:grabbing}
#fieldzv{position:absolute;inset:0;z-index:1001;background:#16301F}
.topview.zv{aspect-ratio:3/2}
.zvbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zvbtns button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(8,20,14,.72);color:#fff;font:700 20px/1 var(--display);cursor:pointer}
.zvscale{position:absolute;left:10px;bottom:8px;color:#fff;font-size:10px;text-shadow:0 1px 2px #000;z-index:3}
.zvscale i{display:block;height:5px;border:2px solid #fff;border-top:0;margin-bottom:2px}
.zvnote{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,20,14,.8);color:#fff;font-size:10.5px;padding:5px 9px;border-radius:10px;max-width:62%;text-align:center;z-index:3;opacity:0;transition:opacity .25s;pointer-events:none}
.zvnote.on{opacity:1}
#topview .wchip{top:10px;left:10px;max-width:60%}
#topview .zvscale{bottom:8px}
#topview .zvnote{top:auto;bottom:34px;max-width:70%}
#fieldzv .zvnote{top:auto;bottom:34px}
.topview .wchip{position:absolute;left:10px;top:10px}
.topview .tlbl{position:absolute;left:10px;bottom:8px;right:10px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000}
.minimap{position:relative;height:130px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.minimap .lbl{position:absolute;left:10px;top:10px;z-index:1100;background:rgba(6,16,27,.8);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}
/* sources */
.src{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.src h4{margin:0;font-size:14px}.src p{margin:0;font-size:12px;color:var(--mute)}
.src .links{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* task 12: live API states */
.netbar{position:sticky;top:0;z-index:15;display:flex;gap:10px;align-items:center;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:#0C1F29;border:1px solid var(--water);font-size:12px}
.spin{flex:0 0 14px;width:14px;height:14px;border-radius:50%;border:2px solid var(--water);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.pill.mode{background:rgba(79,195,247,.18);color:#8FD8FA}
.note.caution::before{background:var(--amber)}
.note{color:var(--ink)}
.err{border-color:rgba(255,122,107,.6)!important;background:rgba(255,122,107,.1)!important}
.say-sum{font-size:13px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;align-items:baseline}
.kv span{color:var(--mute)}.kv b{font-weight:600}
.haz{font-size:11px;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.18)}
.fimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fimgs figure{margin:0;border-radius:12px;overflow:hidden;background:#fff}
.fimgs img{display:block;width:100%}
.fimgs figcaption{font-size:10px;padding:6px;background:var(--deep);color:var(--mute)}
.ctab{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}
.ctab th{text-align:left;color:var(--mute);font-weight:600;padding:4px}
.ctab td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.yrpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 8px}
.yrpick select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.yrpick select option{background:#0C1F29}
</style>

      for(let xx=ax+colSp/2+Math.max(0,Math.floor((x0-ax)/colSp))*colSp;xx<x1;xx+=colSp){const ci=Math.round((xx-ax)/colSp),id=ri*7919+ci;if(++n>60000)break;

}

  ${bn?`দল মাঠে গিয়ে ২০–৩০ সেকেন্ডের ভিডিও করবে (শুধু প্রাপ্তবয়স্ক, কারো মুখ নয়, প্রতিষ্ঠানের অনুমতি নিয়ে)। ফাইলের নাম <b>media/${f.id}.mp4</b> দিলে এখানে নিজে থেকেই চলবে।`:`The team films 20–30 s at the field (adults only, no faces, with the station's permission). Save it as <b>media/${f.id}.mp4</b> and it plays here automatically.`}<br>
  <label>${bn?'এই ফোনের একটি ভিডিও দেখুন':'Try a video from this phone'}<input type="file" accept="video/*" id="rfPick" hidden></label>
  <div style="margin-top:6px;font-size:11px">${bn?'ভিডিও শুধু আপনার ফোনেই চলে, কোথাও আপলোড হয় না।':'The video plays only on your device; nothing is uploaded.'}</div></div>`}
function renderRfTwin(){const f=RF(),el=$('rfTwin'),bn=L()==='bn';el.hidden=!f;$('simLbl').hidden=!f;$('topview').hidden=!f;$('toplbl').hidden=!f;$('minimapBox').hidden=!!f;if(!f)return;requestAnimationFrame(()=>ZVT.fit());
  $('simLbl').textContent=bn?'পাশ থেকে দেখা (অনুমান): বাছাই করা পরিকল্পনায় সপ্তাহে সপ্তাহে ফসল কেমন হবে।':'Side view (simulated): how the chosen plan\'s crop should look, week by week.';
  const ll={lat:f.lat,lng:f.lon};
  el.innerHTML=`<div class="id">${f.id} · ${bn?'আসল জমি, আসল ভিডিও':'REAL FIELD, REAL VIDEO'}</div><strong>${f[L()]}</strong>
   <div class="vid" id="rfVid"><video src="media/${f.id}.mp4" controls muted playsinline preload="metadata"></video></div>
   <div class="maplinks" style="margin-top:10px"><a href="https://www.google.com/maps/@${ll.lat.toFixed(5)},${ll.lng.toFixed(5)},250m/data=!3m1!1e3" target="_blank" rel="noopener">${bn?'Google Maps-এ এই জমির স্যাটেলাইট ছবি':'This exact plot in Google Maps satellite'} ↗</a><a href="https://www.google.com/maps/search/?api=1&query=${ll.lat},${ll.lng}" target="_blank" rel="noopener">${bn?'রাস্তার ছবি ও দিক':'Directions & street photos'} ↗</a></div>`;
  const v=el.querySelector('video');let tried=0;v.onerror=()=>{if(!tried++){v.src=`media/${f.id}.webm`;return}$('rfVid').outerHTML=rfVideoEmpty(f);bindPick(f)};}
function bindPick(f){const i=$('rfPick');if(!i)return;i.onchange=()=>{const file=i.files&&i.files[0];if(!file)return;const u=URL.createObjectURL(file);
  const box=i.closest('.vidempty');box.outerHTML=`<div class="vid" id="rfVid"><video src="${u}" controls autoplay muted playsinline loop></video><span class="pill" style="position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6)">${L()==='bn'?'আপনার ভিডিও · শুধু এই ফোনে':'Your video · this device only'}</span></div>`;
  const nv=$('rfVid').querySelector('video');nv.onerror=()=>toast(L()==='bn'?'এই প্রিভিউ ভিডিও আটকে দিয়েছে। অ্যাপটি নিজের ওয়েবসাইটে চালালে কাজ করবে।':'This preview blocked the video. It works when the app runs on its own website.')}}
/* ---------- navigation ---------- */
const NAVI=['field','now','crop','twin','flood','pics'];
function go(s){S.screen=s;if(s!=='twin')setPlay(false);stopSpeak();document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on',el.id==='s-'+s));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===s?'page':'false'));
  if(s==='field'){renderRfField();setTimeout(initMap,60)}if(s==='prev'){renderPrev();renderFarmExtras()}if(s==='crop')renderPlans(false);if(s==='twin'){renderTwin();renderRfTwin();setTimeout(initMini,80)}if(s==='flood')renderFlood();if(s==='sources')renderSources();if(s==='help')renderHelp();$('main').scrollTop=0}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('confirmField').onclick=()=>go('prev');
$('toCrop').onclick=()=>{S.optCrop=null;TWD=null;go('crop');renderPlans(true)};
$('floodBtn').onclick=()=>{S.flooded=!S.flooded;S.optCrop=null;TWD=null;renderPrev();speak(S.flooded?(L()==='bn'?'জমিতে বন্যা হয়েছে':'My field flooded'):(L()==='bn'?'না':'No'))};
$('srcBtn').onclick=()=>go('sources');
document.querySelector('.logo').onclick=()=>go('start');
$('teaser').onclick=()=>{S.fdist='feni';go('flood')};
$('gps').onclick=()=>{
  const done=(lat,lon,real)=>{S.rf=null;S.gps=true;S.optCrop=null;TWD=null;S.lat=lat;S.lon=lon;S.fieldLL=null;if(S.map){S.map.setView([lat,lon],17)}go('field');if(!real)toast(L()==='bn'?'এই প্রিভিউতে লোকেশন বন্ধ, তাই কুমিল্লার একটি নমুনা জমি দেখানো হচ্ছে। আসল অ্যাপে GPS আপনার জমি খুঁজে দেবে।':'Location is blocked in this preview, so a sample field in Cumilla is shown. In the real app, GPS finds your field.')};
  if(!navigator.geolocation){done(23.4607,91.1809,false);return}
  let settled=false;const t=setTimeout(()=>{if(!settled){settled=true;done(23.4607,91.1809,false)}},3500);
  try{navigator.geolocation.getCurrentPosition(p=>{if(settled)return;settled=true;clearTimeout(t);done(p.coords.latitude,p.coords.longitude,true)},()=>{if(settled)return;settled=true;clearTimeout(t);done(23.4607,91.1809,false)},{timeout:3000})}catch(e){settled=true;clearTimeout(t);done(23.4607,91.1809,false)}
};

/* ---------- language / simple ---------- */
function setLang(l){S.lang=l;save();render()}
$('lang-en').onclick=()=>setLang('en');$('lang-bn').onclick=()=>setLang('bn');
$('simple').onclick=()=>{S.simple=!S.simple;save();render();toast(S.simple?(L()==='bn'?'সহজ ভাষা চালু।':'Simple words on.'):(L()==='bn'?'পূর্ণ লেখা চালু।':'Full text on.'))};

function render(){
  document.body.classList.toggle('lang-bn',L()==='bn');document.documentElement.lang=L();
  document.getElementById('app').classList.toggle('pics-mode',S.pics);
  $('lang-en').setAttribute('aria-pressed',L()==='en');$('lang-bn').setAttribute('aria-pressed',L()==='bn');$('simple').setAttribute('aria-pressed',S.simple);
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tr(T[el.dataset.t])});
  document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=I[el.dataset.icon]});
  $('speak').innerHTML=I.speaker;$('narr').innerHTML=I.speaker;$('playAll').innerHTML=I.speaker;$('playBtn').innerHTML=S.playing?I.pause:I.play;
  document.querySelectorAll('nav button').forEach((b,i)=>b.innerHTML=I[NAVI[i]]+`<span>${T.nav[L()][i]}</span>`);
  $('districts').innerHTML=DIST.map(d=>`<button class="chip" data-d="${d[0]}" aria-pressed="${d[0]===S.district}">${L()==='bn'?d[2]:d[1]}</button>`).join('');
  document.querySelectorAll('#districts .chip').forEach(b=>b.onclick=()=>{const d=DIST.find(x=>x[0]===b.dataset.d);S.rf=null;S.gps=false;S.optCrop=null;TWD=null;S.district=d[0];S.lat=d[3];S.lon=d[4];S.fieldLL=null;if(S.map){S.map.setView([S.lat,S.lon],16);S.fieldLL={lat:S.lat+0.0004,lng:S.lon+0.0003};drawPoly()}go('field')});
  renderRfList();
  $('coords').textContent=RF()?(L()==='bn'?'আসল জমি · ':'Real field · ')+num(S.lat.toFixed(4))+'° N, '+num(S.lon.toFixed(4))+'° E':(L()==='bn'?'GPS চালু · ':'GPS on · ')+num(S.lat.toFixed(2))+'° N, '+num(S.lon.toFixed(2))+'° E';
  $('teaser').innerHTML=`<span style="flex:0 0 auto">${I.rain}</span><span style="flex:1"><strong>${L()==='bn'?'আগস্ট ২০২৪-এর বন্যা':'The August 2024 flood'}</strong><br><span class="sub" style="font-size:11px">${L()==='bn'?'আসল NASA তথ্য · বন্যার পর মাটি কবে তৈরি হলো দেখুন ›':'Real NASA data · see when the soil was ready again ›'}</span></span>`;
  netBanner();
  if(S.screen==='field'){renderRfField();if(S.live){mapStatus();setAreaText();mapLinks();drawPoly()}else{drawMap();mapStatus();setAreaText();mapLinks()}}if(S.screen==='prev'){renderPrev();renderFarmExtras()}if(S.screen==='crop')renderPlans(false);if(S.screen==='twin'){renderTwin();renderRfTwin();initMini()}if(S.screen==='flood')renderFlood();if(S.screen==='sources')renderSources();if(S.screen==='help')renderHelp();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.screen?'page':'false'));
}
render();
/* wake the free server early, and take the district list from the API */
load('/api/v1/districts',{}).then(res=>{const ds=res.env&&res.env.data&&res.env.data.districts;if(Array.isArray(ds)&&ds.length&&ds[0].name){DIST.length=0;ds.forEach(d=>DIST.push([d.id,d.name.en,d.name.bn,d.lat,d.lon]));if(S.screen==='start'||S.screen==='flood')render()}});
})();
</script>

</body></html>
